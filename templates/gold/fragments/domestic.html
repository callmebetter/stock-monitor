<time id="header-ts" class="num" hx-swap-oob="innerHTML">{{ ts|ts }}</time>
<div id="mod-domestic-body" hx-swap-oob="innerHTML">
  <div class="card p-4 h-full">
    <div class="flex items-center justify-between mb-3">
      <h2 class="flex items-center gap-2 text-sm font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-[#d4a537]"></span>
        国内现货
        <span class="text-[11px] font-normal text-muted">上海黄金交易所 · 元/克</span>
        {% if stale %}<span class="badge badge-warning badge-sm font-normal">缓存</span>{% endif %}
      </h2>
      <button class="btn btn-ghost btn-xs"
              hx-get="/web/gold/fragments/domestic" hx-target="#mod-domestic-body"
              hx-swap="none" hx-disabled-elt="this">
        <span class="btn-idle">⟳ 刷新</span><span class="btn-busy">刷新中…</span>
      </button>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      {% for q in data %}
      <div class="stat-tile">
        <div class="flex items-baseline justify-between gap-1">
          <span class="text-[11px] text-muted">{{ q.symbol }}</span>
          <span class="text-[10px] text-muted/70">{{ q.unit }}</span>
        </div>
        <div class="num text-xl sm:text-2xl mt-1.5 leading-none">{{ q.price|num(2) }}</div>
        {% if q.name and q.name != q.symbol %}
        <div class="text-[10px] text-muted/70 mt-1 truncate">{{ q.name }}</div>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </div>
</div>
