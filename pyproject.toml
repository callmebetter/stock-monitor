[project]
name = "stock-monitor"
version = "0.1.0"
description = "Stock monitoring service with scheduled data collection"
requires-python = ">=3.11"

dependencies = [
    "apscheduler",
    # For stock data fetching
    "akshare",
    # For MySQL database connectivity
    "pymysql",
    # For building the backend API
    "fastapi",
    # For running FastAPI applications
    "uvicorn",
    "python-dotenv",
    "sqlalchemy",
    "cryptography>=50.0.1",
]
